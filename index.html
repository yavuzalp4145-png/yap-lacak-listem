<style>html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Yapılacaklar Listem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Düzen: tek sütun mobil uygulama; üstte ilerleme, ortada liste, altta sabit Ekle düğmesi. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --ink:#151a2c; --mute:#69728e; --line:#e1e5ef;
  --accent:#3a44e0; --accent-ink:#ffffff; --accent-soft:#e8eaff;
  --done-bg:#d8f4e2; --done-line:#3fbf74; --done-ink:#14532d;
  --alarm:#c26a00; --alarm-soft:#fff0d9; --danger:#d6314b; --danger-soft:#ffe4e9;
  --shadow:0 6px 24px rgba(30,40,90,.10);
  --market:#cf3f24; --market-soft:#ffe6df; --pazar:#8e2fc0; --pazar-soft:#f3e3fb;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'DM Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#171b2e; --ink:#eceffa; --mute:#98a0bf; --line:#292f4d;
  --accent:#8089ff; --accent-ink:#0e1120; --accent-soft:#23284d;
  --done-bg:#14392a; --done-line:#3fbf74; --done-ink:#c9f3d9;
  --alarm:#f5a03a; --alarm-soft:#3a2a12; --danger:#ff7088; --danger-soft:#3d1a24;
  --shadow:0 6px 24px rgba(0,0,0,.45); --market:#ff8a70; --market-soft:#3d2019; --pazar:#cf94ff; --pazar-soft:#2f1d3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#171b2e; --ink:#eceffa; --mute:#98a0bf; --line:#292f4d;
  --accent:#8089ff; --accent-ink:#0e1120; --accent-soft:#23284d;
  --done-bg:#14392a; --done-line:#3fbf74; --done-ink:#c9f3d9;
  --alarm:#f5a03a; --alarm-soft:#3a2a12; --danger:#ff7088; --danger-soft:#3d1a24;
  --shadow:0 6px 24px rgba(0,0,0,.45); --market:#ff8a70; --market-soft:#3d2019; --pazar:#cf94ff; --pazar-soft:#2f1d3d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body[data-cat="market"]{--accent:var(--market);--accent-soft:var(--market-soft)}
body[data-cat="pazar"]{--accent:var(--pazar);--accent-soft:var(--pazar-soft)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);
  padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.date{margin:0;color:var(--mute);font-size:14px;font-weight:500;text-transform:capitalize}
h1{margin:2px 0 0;font:800 32px/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.prog{display:flex;align-items:center;gap:16px;background:var(--accent);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 78%,#fff));color:var(--accent-ink);border-radius:24px;padding:18px;box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 35%,transparent);transition:background .3s}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--accent-ink);opacity:.22} .ring .fg{stroke:var(--accent-ink);transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.prog strong{display:block;font:800 22px var(--f-display)} .prog span{font-size:14px;opacity:.85} .prog small{display:block;font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.chips{display:flex;gap:8px}
.chip{flex:1;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
.chip em{font-style:normal;font-variant-numeric:tabular-nums;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--bg)}
.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-selected="true"] em{background:rgba(255,255,255,.22)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{font-size:28px}
.logo{width:52px;height:52px;border-radius:14px;flex:none;box-shadow:0 6px 16px rgba(11,13,51,.4)}
.sync{display:none!important}
.right{display:flex;gap:8px;align-items:center}
.sync{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--mute)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync[data-s="ok"] i{background:var(--done-line)} .sync[data-s="syncing"] i{background:var(--alarm);animation:pulse 1s infinite} .sync[data-s="offline"] i{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
@keyframes rin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:380px){.sync span{display:none}.sync{padding:0 14px}}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:19px;background:var(--accent);transform:translateX(calc(var(--i,0)*100%));transition:transform .38s cubic-bezier(.3,1.25,.4,1),background .3s;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.tab{position:relative;z-index:1;min-height:66px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 15px var(--f-display);color:var(--mute);transition:color .25s}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--accent-ink)}
.tab b{position:absolute;top:6px;right:8px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;font:700 11px/20px var(--f-body);text-align:center;background:var(--bg);color:var(--mute);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] b{background:rgba(255,255,255,.25);color:var(--accent-ink)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.chk{flex:none;width:48px;height:48px;display:grid;place-items:center}
.chk i{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--mute);display:grid;place-items:center;transition:all .18s ease;background:var(--surface)}
.chk svg{width:18px;height:18px;stroke:#fff;opacity:0;transform:scale(.6);transition:all .18s ease}
.chk[aria-checked="true"] i{background:var(--done-line);border-color:var(--done-line)}
.chk[aria-checked="true"] svg{opacity:1;transform:none}
.card{flex:1;min-width:0;display:flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;transition:background .2s,border-color .2s;box-shadow:var(--shadow)}
.card.done{background:var(--done-bg);border-color:var(--done-line);color:var(--done-ink)}
.txt{flex:1;min-width:0;text-align:left;padding:12px 4px 12px 14px;display:flex;flex-direction:column;gap:6px}
.txt .t{font-weight:600;overflow-wrap:anywhere}
.card.done .t{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.8}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mute)}
.tag svg{width:13px;height:13px}
.tag.al{background:var(--alarm-soft);color:var(--alarm)} .tag.late{background:var(--danger-soft);color:var(--danger)}
.tag.p1{background:var(--alarm-soft);color:var(--alarm)} .tag.p2{background:var(--danger-soft);color:var(--danger)}
.card.done .tag{background:rgba(255,255,255,.4);color:var(--done-ink)}
:root[data-theme="dark"] .card.done .tag{background:rgba(255,255,255,.12)}
.del{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--mute);border-radius:12px}
.del svg{width:20px;height:20px} .card.done .del{color:var(--done-ink)}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.empty h2{font:700 20px var(--f-display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0}
.link{align-self:center;color:var(--mute);font-weight:600;font-size:14px;min-height:44px;padding:0 12px;text-decoration:underline}
.note{text-align:center;color:var(--mute);font-size:12.5px;margin:0}
.fabwrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));z-index:20}
.fab{pointer-events:auto;height:60px;padding:0 28px 0 20px;border-radius:30px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:10px;font:700 18px var(--f-display);box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 50%,transparent)}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.97)}
.scrim{position:fixed;inset:0;background:rgba(8,10,25,.55);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;margin:0 auto;max-width:600px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding:18px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-head h2{margin:0;font:700 22px var(--f-display)}
.inrow{display:flex;gap:10px;align-items:stretch}
.inrow input{flex:1;min-width:0;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 16px;font:500 17px var(--f-body)}
.inrow input:focus{border-color:var(--accent);outline:none}
.alarm-btn{flex:none;width:56px;height:56px;border-radius:16px;background:var(--alarm-soft);color:var(--alarm);display:grid;place-items:center}
.alarm-btn svg{width:26px;height:26px}
.err{color:var(--danger);font-size:14px;font-weight:600;margin:8px 2px 0}
.achip{margin-top:10px;display:inline-flex;align-items:center;gap:6px;background:var(--alarm-soft);color:var(--alarm);border-radius:99px;padding:4px 4px 4px 12px;font-weight:700;font-size:14px}
.achip button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.achip svg{width:16px;height:16px}
.lbl{display:block;margin:16px 2px 8px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:46px;border-radius:14px;border:1.5px solid var(--line);font-weight:600;color:var(--mute)}
.seg button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.save{margin-top:20px;width:100%;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:700 18px var(--f-display)}
.ghost{width:100%;min-height:48px;border-radius:14px;font-weight:600;color:var(--mute);margin-top:6px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.q{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.q[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mon strong{font:700 17px var(--f-display);text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .wd{font-size:12px;font-weight:700;color:var(--mute);padding:6px 0}
.grid button{aspect-ratio:1;max-height:46px;border-radius:50%;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.grid button:disabled{opacity:.28;cursor:default}
.grid button.today::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.grid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grid button[aria-pressed="true"].today::after{background:var(--accent-ink)}
.time{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 4px}
.step{display:flex;flex-direction:column;align-items:center;gap:2px}
.step button{width:56px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:18px;line-height:1}
.step input{width:76px;height:64px;text-align:center;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:800 34px var(--f-display);font-variant-numeric:tabular-nums}
.step input:focus{border-color:var(--accent);outline:none}
.colon{font:800 30px var(--f-display);padding-bottom:4px}
.sum{text-align:center;font-weight:700;margin:12px 0 0;min-height:24px}
.sum.bad{color:var(--danger)}
.ringer{position:fixed;inset:0;z-index:50;background:rgba(8,10,25,.82);display:grid;place-items:center;padding:20px}
.ring-card{width:100%;max-width:400px;background:var(--surface);border-radius:28px;padding:28px 22px 22px;text-align:center;box-shadow:var(--shadow)}
.bell{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:var(--alarm-soft);color:var(--alarm);display:grid;place-items:center;animation:ring 1s ease-in-out infinite}
.bell svg{width:44px;height:44px}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(0)}}
.ring-card p{margin:0;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.ring-card h2{margin:6px 0 20px;font:800 26px/1.2 var(--f-display);overflow-wrap:anywhere}
.ring-card .save{margin-top:0;background:var(--done-line);color:#062a14}
.ring-card .row2{display:flex;gap:8px;margin-top:8px}
.ring-card .row2 button{flex:1;min-height:50px;border-radius:14px;border:1.5px solid var(--line);font-weight:700}
.hint{font-size:13px;color:var(--mute);margin:12px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.toast button{font-weight:800;color:var(--accent);background:var(--bg);border-radius:10px;min-height:36px;padding:0 12px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const KEY='yapilacaklar-v1';
const I={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
};
const PRI=['','Önemli','Acil'];
let S={items:[],seeded:false,updated:0,theme:''};
let filter='all',ref=null,writing=false,dirty=false,wTimer=null;
let tab='birincil',animateNext=false,syncS='local';

const CATS=['birincil','market','pazar'];
const CN={birincil:'Birincil',market:'Market',pazar:'Pazar'};
function norm(o){return {items:(o.items||[]).map(i=>Object.assign({},i,{cat:CATS.includes(i.cat)?i.cat:'birincil'})),seeded:!!o.seeded,updated:o.updated||0,theme:o.theme||''}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.items))return o}}catch(e){}return null}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function persist(){S.updated=Date.now();saveLocal();dirty=true;if(ref)setSync('syncing');clearTimeout(wTimer);wTimer=setTimeout(flush,700)}
function setSync(v){
  syncS=v;const el=$('#sync');el.dataset.s=v;
  $('#syncTxt').textContent={local:'Bu cihazda',syncing:'Kaydediliyor',ok:'Bulutta',offline:'Çevrimdışı'}[v];
  el.title={local:'Veriler bu cihazda saklanıyor',syncing:'Buluta kaydediliyor',ok:'Buluta kaydedildi',offline:'Buluta ulaşılamadı, bağlanınca tekrar denenecek'}[v];
}
async function flush(){
  if(!ref||writing||!dirty)return;
  writing=true;dirty=false;setSync('syncing');
  try{await ref.set({items:S.items,seeded:S.seeded,updated:S.updated,theme:S.theme});if(!dirty)setSync('ok')}
  catch(e){dirty=true;setSync('offline');clearTimeout(wTimer);wTimer=setTimeout(flush,8000)}
  writing=false;
  if(dirty&&syncS!=='offline'){clearTimeout(wTimer);wTimer=setTimeout(flush,700)}
}
async function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u)return;
    const id=await u.id();
    if(!id)return;
    ref=d.collection('data/users/'+id).doc('tasks');
    setSync('syncing');
    ref.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(!snap.exists){if(S.updated){dirty=true;flush()}else setSync('ok');return}
      const r=JSON.parse(JSON.stringify(snap.data()));
      const ru=r.updated||0;
      if(ru>S.updated){S=norm(r);saveLocal();applyTheme();render()}
      else if(ru<S.updated&&!writing){dirty=true;flush();return}
      if(!writing&&!dirty)setSync('ok');
    },()=>setSync('offline'));
  }catch(e){setSync('local')}
}

function fmtAlarm(ts){
  const d=new Date(ts),n=new Date();
  const t=pad(d.getHours())+':'+pad(d.getMinutes());
  const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const diff=Math.round((a-b)/864e5);
  if(diff===0)return 'Bugün '+t;
  if(diff===1)return 'Yarın '+t;
  if(diff===-1)return 'Dün '+t;
  return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' '+t;
}
function sorted(){
  return S.items.slice().sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    const x=a.alarm||Infinity,y=b.alarm||Infinity;
    if(x!==y)return x-y;
    return b.created-a.created;
  });
}
function tag(cls,html,text){
  const s=document.createElement('span');s.className='tag '+cls;
  s.innerHTML=html||'';s.appendChild(document.createTextNode(text));return s;
}
function render(){
  const mine=S.items.filter(i=>i.cat===tab);const total=mine.length,done=mine.filter(i=>i.done).length,todo=total-done;renderTabs();
  $('#cAll').textContent=total;$('#cTodo').textContent=todo;$('#cDone').textContent=done;
  const pct=total?Math.round(done/total*100):0;
  $('#pct').textContent=pct+'%';
  $('#ringFg').style.strokeDashoffset=163.36*(1-pct/100);
  $('#progTxt').textContent=total?done+' / '+total+' tamamlandı':'Liste boş';
  $('#progSub').textContent=!total?'İlk görevini ekle':todo?todo+' görev kaldı':'Hepsi bitti, tebrikler!';
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-selected',c.dataset.f===filter));
  const list=$('#list');list.textContent='';
  const now=Date.now();
  const rows=sorted().filter(i=>i.cat===tab&&(filter==='all'||(filter==='done')===i.done));
  rows.forEach((it,ix)=>{
    const li=document.createElement('li');li.className='row';
    if(animateNext){li.style.animation='rin .32s ease both';li.style.animationDelay=(ix*45)+'ms'}
    const chk=document.createElement('button');chk.className='chk';chk.setAttribute('role','checkbox');
    chk.setAttribute('aria-checked',it.done);chk.setAttribute('aria-label','Tamamlandı olarak işaretle: '+it.text);
    chk.innerHTML='<i>'+I.check+'</i>';
    chk.onclick=()=>{it.done=!it.done;if(it.done)it.fired=true;persist();render()};
    const card=document.createElement('div');card.className='card'+(it.done?' done':'');
    const txt=document.createElement('button');txt.className='txt';txt.setAttribute('aria-label','Düzenle: '+it.text);
    const t=document.createElement('span');t.className='t';t.textContent=it.text;txt.appendChild(t);
    const meta=document.createElement('span');meta.className='meta';
    if(it.alarm){const late=it.alarm<now&&!it.done;meta.appendChild(tag(late?'late':'al',I.bell,fmtAlarm(it.alarm)))}
    if(it.pri)meta.appendChild(tag('p'+it.pri,'',PRI[it.pri]));
    if(it.ex)meta.appendChild(tag('','','Örnek'));
    if(meta.childNodes.length)txt.appendChild(meta);
    txt.onclick=()=>openSheet(it.id);
    const del=document.createElement('button');del.className='del';del.setAttribute('aria-label','Sil: '+it.text);
    del.innerHTML=I.trash;del.onclick=()=>removeTask(it.id);
    card.append(txt,del);li.append(chk,card);list.appendChild(li);
  });
  animateNext=false;const empty=!rows.length;
  $('#empty').hidden=!empty;
  if(empty){
    const m={all:['Henüz görev yok','Aşağıdaki Görev ekle düğmesine dokun.'],todo:['Bekleyen görev yok','Her şey tamam, rahat bir nefes al.'],done:['Biten görev yok','Bir görevin kutusuna dokununca burada görünür.']}[filter];
    $('#emptyH').textContent=m[0];$('#emptyP').textContent=m[1];
  }
  $('#clearDone').hidden=!done;
}
function renderTabs(){
  document.body.dataset.cat=tab;
  $('#tabs').style.setProperty('--i',CATS.indexOf(tab));
  document.querySelectorAll('.tab').forEach(t=>{
    const c=t.dataset.c,n=S.items.filter(i=>i.cat===c&&!i.done).length;
    t.setAttribute('aria-selected',c===tab);
    const b=t.querySelector('b');b.textContent=n;b.hidden=!n;
  });
  $('#progCat').textContent=CN[tab];
}
function setTab(c){
  if(!CATS.includes(c)||c===tab)return;
  tab=c;animateNext=true;
  try{localStorage.setItem('yapilacaklar-tab',tab)}catch(e){}
}
function applyTheme(){
  const r=document.documentElement;
  if(S.theme)r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');
  const dark=(S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';
  $('#themeBtn').innerHTML=dark?I.sun:I.moon;
}
/* ---------- Ses ve alarm ---------- */
let actx=null,queue=[],cur=null,ringInt=null,ringTO=null;
function unlockAudio(){
  try{
    if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}
    if(actx&&actx.state==='suspended')actx.resume();
  }catch(e){}
}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
function beepSeq(){
  if(!actx)return;
  const t=actx.currentTime;
  [0,.24,.48,.72].forEach((o,i)=>{
    const osc=actx.createOscillator(),g=actx.createGain();
    osc.type='sine';osc.frequency.value=i%2?988:1318;
    g.gain.setValueAtTime(.0001,t+o);
    g.gain.exponentialRampToValueAtTime(.4,t+o+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+o+.2);
    osc.connect(g);g.connect(actx.destination);osc.start(t+o);osc.stop(t+o+.22);
  });
}
function buzz(){try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}}
function stopSound(){clearInterval(ringInt);clearTimeout(ringTO);ringInt=ringTO=null}
function showRing(){
  cur=null;
  while(queue.length){
    const it=S.items.find(x=>x.id===queue.shift());
    if(it&&!it.done){cur=it;break}
  }
  if(!cur)return;
  $('#ringTxt').textContent=cur.text;
  $('#ringer').hidden=false;
  $('#ringHint').hidden=!!(actx&&actx.state==='running');
  beepSeq();buzz();
  ringInt=setInterval(()=>{beepSeq();buzz()},1600);
  ringTO=setTimeout(stopSound,120000);
}
function stopRing(){
  stopSound();$('#ringer').hidden=true;cur=null;
  if(queue.length)setTimeout(showRing,300);
}
function tick(){
  const now=Date.now();let ch=false;
  S.items.forEach(it=>{
    if(it.alarm&&!it.fired&&!it.done&&it.alarm<=now){it.fired=true;ch=true;queue.push(it.id)}
  });
  if(ch){persist();render()}
  if(queue.length&&$('#ringer').hidden)showRing();
}

/* ---------- Bildirim çubuğu ve geri alma ---------- */
let toastT=null,undoSnap=null;
function toast(msg,undo){
  $('#toastTxt').textContent=msg;
  $('#toastBtn').hidden=!undo;
  $('#toast').hidden=false;
  clearTimeout(toastT);
  toastT=setTimeout(()=>{$('#toast').hidden=true},undo?5000:2200);
}
function snapshot(){undoSnap=JSON.stringify(S.items)}
$('#toastBtn').onclick=()=>{
  if(undoSnap){S.items=JSON.parse(undoSnap);undoSnap=null;persist();render()}
  $('#toast').hidden=true;
};
function removeTask(id){
  snapshot();S.items=S.items.filter(x=>x.id!==id);persist();render();toast('Görev silindi',true);
}

/* ---------- Görev penceresi ---------- */
let editId=null,draft={alarm:null,pri:0};
function showView(v){$('#vTask').hidden=v!=='task';$('#vCal').hidden=v!=='cal'}
function syncDraft(){
  $('#achip').hidden=!draft.alarm;
  if(draft.alarm)$('#achipTxt').textContent='Alarm: '+fmtAlarm(draft.alarm);
  document.querySelectorAll('#priSeg button').forEach(b=>b.setAttribute('aria-checked',+b.dataset.p===draft.pri));
  document.querySelectorAll('#catSeg button').forEach(b=>b.setAttribute('aria-checked',b.dataset.k===draft.cat));
}
function openSheet(id){
  unlockAudio();
  editId=id||null;
  const it=id?S.items.find(x=>x.id===id):null;
  draft={alarm:it?it.alarm:null,pri:it?(it.pri||0):0,cat:it?it.cat:tab};
  $('#shTitle').textContent=it?'Görevi düzenle':'Yeni görev';
  $('#taskIn').value=it?it.text:'';
  $('#err').hidden=true;
  showView('task');syncDraft();
  $('#scrim').hidden=false;$('#sheet').hidden=false;document.body.classList.add('lock');
  setTimeout(()=>$('#taskIn').focus(),80);
}
function closeSheet(){$('#scrim').hidden=true;$('#sheet').hidden=true;document.body.classList.remove('lock')}
function saveTask(){
  const text=$('#taskIn').value.trim();
  if(!text){
    $('#err').hidden=false;
    const i=$('#taskIn');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');i.focus();return;
  }
  const it=editId?S.items.find(x=>x.id===editId):null;
  if(it){
    if(it.alarm!==draft.alarm)it.fired=false;
    it.text=text;it.alarm=draft.alarm;it.pri=draft.pri;it.cat=draft.cat;it.ex=false;
  }else{
    S.items.push({id:uid(),text,cat:draft.cat,done:false,pri:draft.pri,alarm:draft.alarm,fired:false,created:Date.now()});
  }
  S.seeded=true;
  if(filter==='done')filter='all';
  setTab(draft.cat);
  persist();render();closeSheet();
  toast(draft.alarm?'Kaydedildi, alarm kuruldu':'Görev kaydedildi');
}
/* ---------- Takvim ve saat ---------- */
let cal={vy:0,vm:0,y:0,m:0,d:0,h:9,mi:0};
const DAYS=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
function todayStart(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function calTs(){return new Date(cal.y,cal.m,cal.d,cal.h,cal.mi).getTime()}
function setDay(dt){cal.y=cal.vy=dt.getFullYear();cal.m=cal.vm=dt.getMonth();cal.d=dt.getDate()}
function openCal(){
  let base;
  if(draft.alarm&&draft.alarm>Date.now())base=new Date(draft.alarm);
  else{base=new Date();base.setMinutes(0,0,0);base.setHours(base.getHours()+1)}
  setDay(base);cal.h=base.getHours();cal.mi=base.getMinutes();
  showView('cal');renderCal();
}
function renderCal(){
  const first=new Date(cal.vy,cal.vm,1),ts=todayStart();
  $('#mTitle').textContent=first.toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
  const atNow=(cal.vy===ts.getFullYear()&&cal.vm===ts.getMonth());
  $('#mPrev').disabled=atNow;$('#mPrev').style.opacity=atNow?.35:1;
  const g=$('#grid');g.textContent='';
  DAYS.forEach(n=>{const w=document.createElement('div');w.className='wd';w.textContent=n;g.appendChild(w)});
  const off=(first.getDay()+6)%7;
  for(let i=0;i<off;i++)g.appendChild(document.createElement('span'));
  const len=new Date(cal.vy,cal.vm+1,0).getDate();
  for(let d=1;d<=len;d++){
    const dt=new Date(cal.vy,cal.vm,d),b=document.createElement('button');
    b.textContent=d;b.disabled=dt<ts;
    if(+dt===+ts)b.classList.add('today');
    b.setAttribute('aria-pressed',cal.y===cal.vy&&cal.m===cal.vm&&cal.d===d);
    b.onclick=()=>{cal.y=cal.vy;cal.m=cal.vm;cal.d=d;renderCal()};
    g.appendChild(b);
  }
  $('#hh').value=pad(cal.h);$('#mm').value=pad(cal.mi);
  const sel=new Date(cal.y,cal.m,cal.d);
  document.querySelectorAll('#quick .q').forEach(q=>{
    const t=new Date(ts);t.setDate(t.getDate()+ +q.dataset.d);
    q.setAttribute('aria-pressed',+t===+sel);
  });
  document.querySelectorAll('#qtime .q').forEach(q=>q.setAttribute('aria-pressed',q.dataset.t===pad(cal.h)+':'+pad(cal.mi)));
  const ok=calTs()>Date.now(),s=$('#sum');
  s.className='sum'+(ok?'':' bad');
  s.textContent=ok?sel.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})+' · '+pad(cal.h)+':'+pad(cal.mi):'Geçmiş bir zaman seçildi, ileri bir saat seç.';
  $('#calOk').disabled=!ok;$('#calOk').style.opacity=ok?1:.4;
}
function readTime(){
  const h=parseInt($('#hh').value,10),m=parseInt($('#mm').value,10);
  if(!isNaN(h))cal.h=Math.min(23,Math.max(0,h));
  if(!isNaN(m))cal.mi=Math.min(59,Math.max(0,m));
  renderCal();
}
$('#hh').onchange=$('#mm').onchange=readTime;
$('#hh').onfocus=$('#mm').onfocus=e=>e.target.select();
document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{
  const s=b.dataset.s;
  if(s==='h+')cal.h=(cal.h+1)%24;
  if(s==='h-')cal.h=(cal.h+23)%24;
  if(s==='m+')cal.mi=(cal.mi+5)%60;
  if(s==='m-')cal.mi=(cal.mi+55)%60;
  renderCal();
});
document.querySelectorAll('#quick .q').forEach(q=>q.onclick=()=>{
  const t=todayStart();t.setDate(t.getDate()+ +q.dataset.d);setDay(t);renderCal();
});
document.querySelectorAll('#qtime .q').forEach(q=>q.onclick=()=>{
  const p=q.dataset.t.split(':');cal.h=+p[0];cal.mi=+p[1];renderCal();
});
$('#mPrev').onclick=()=>{const d=new Date(cal.vy,cal.vm-1,1);cal.vy=d.getFullYear();cal.vm=d.getMonth();renderCal()};
$('#mNext').onclick=()=>{const d=new Date(cal.vy,cal.vm+1,1);cal.vy=d.getFullYear();cal.vm=d.getMonth();renderCal()};
$('#calOk').onclick=()=>{
  unlockAudio();
  const ts=calTs();if(ts<=Date.now())return;
  draft.alarm=ts;syncDraft();showView('task');
};
$('#calBack').onclick=()=>showView('task');
$('#soundTest').onclick=()=>{unlockAudio();setTimeout(beepSeq,60)};

/* ---------- Olaylar ---------- */
$('#shClose').innerHTML=I.x;$('#alarmBtn').innerHTML=I.bell;$('#achipX').innerHTML=I.x;
$('#calBack').innerHTML=I.left;$('#mPrev').innerHTML=I.left;$('#mNext').innerHTML=I.right;$('#bellIc').innerHTML=I.bell;
$('#fab').onclick=()=>openSheet();
$('#scrim').onclick=closeSheet;$('#shClose').onclick=closeSheet;
$('#saveBtn').onclick=saveTask;
$('#taskIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveTask()}});
$('#taskIn').addEventListener('input',()=>{$('#err').hidden=true});
$('#alarmBtn').onclick=openCal;
$('#achipTxt').onclick=openCal;
$('#achipX').onclick=()=>{draft.alarm=null;syncDraft()};
document.querySelectorAll('#priSeg button').forEach(b=>b.onclick=()=>{draft.pri=+b.dataset.p;syncDraft()});
document.querySelectorAll('#catSeg button').forEach(b=>b.onclick=()=>{draft.cat=b.dataset.k;syncDraft()});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.f;render()});
$('#clearDone').onclick=()=>{snapshot();S.items=S.items.filter(i=>!(i.done&&i.cat===tab));persist();render();toast('Biten görevler temizlendi',true)};
$('#themeBtn').onclick=()=>{
  const dark=(S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';
  S.theme=dark?'light':'dark';applyTheme();persist();
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
$('#ringDone').onclick=()=>{if(cur){cur.done=true;persist();render()}stopRing()};
$('#ringSnooze').onclick=()=>{
  if(cur){cur.alarm=Date.now()+600000;cur.fired=false;persist();render();toast('10 dakika sonra tekrar çalacak')}
  stopRing();
};
$('#ringStop').onclick=stopRing;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{setTab(t.dataset.c);filter='all';render()});
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(!$('#sheet').hidden||!$('#ringer').hidden)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<80||Math.abs(dy)>45)return;
  const n=CATS.indexOf(tab)+(dx<0?1:-1);
  if(n>=0&&n<CATS.length){setTab(CATS[n]);filter='all';render()}
},{passive:true});

/* ---------- Başlangıç ---------- */
function seed(){
  const n=Date.now(),mk=(text,cat,pri,done,k)=>({id:uid(),text,cat,done:!!done,pri,alarm:null,fired:!!done,created:n-k,ex:true});
  S.items=[
    mk('Faturaları öde','birincil',1,false,6),mk('Doktor randevusu için ara','birincil',0,false,5),mk('Sabah yürüyüşü','birincil',0,true,4),
    mk('Süt ve yumurta','market',0,false,3),mk('Temizlik malzemesi','market',0,false,2),
    mk('Domates ve salatalık','pazar',0,false,1),mk('Limon','pazar',0,false,0)
  ];
  S.seeded=true;
}
const loc=loadLocal();
try{const t=localStorage.getItem('yapilacaklar-tab');if(CATS.includes(t))tab=t}catch(e){}
if(loc)S=norm(loc);else seed();
$('#date').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
applyTheme();render();tick();
setInterval(tick,1000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
initDb();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
